name: Renovate

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: kubernetes
    container:
      image: ghcr.io/renovatebot/renovate:latest
    steps:
      - name: Run Renovate
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: https://git.mythogen.cc/api/v1
          RENOVATE_TOKEN: ${{ secrets.HOMELAB_PAT || secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
          RENOVATE_USERNAME: rcbop
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@mythogen.cc>"
        run: renovate
